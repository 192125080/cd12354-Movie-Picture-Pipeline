name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend

defaults:
  run:
    working-directory: starter/frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - run: aws eks update-kubeconfig --region "$AWS_REGION" --name cluster
        working-directory: .
      - id: backend
        run: |
          for attempt in $(seq 1 60); do
            hostname=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$hostname" ]; then
              echo "url=http://${hostname}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for backend LoadBalancer hostname (attempt ${attempt}/60)..."
            sleep 10
          done
          echo "Backend service or LoadBalancer hostname is unavailable." >&2
          exit 1
        working-directory: .
      - id: registry
        run: echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: starter/frontend
          push: true
          build-args: |
            REACT_APP_MOVIE_API_URL=${{ steps.backend.outputs.url }}
          tags: ${{ steps.registry.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      - id: image
        run: echo "image=${{ steps.registry.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        working-directory: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - run: aws eks update-kubeconfig --region "$AWS_REGION" --name cluster
        working-directory: .
      - run: kubectl apply -k starter/frontend/k8s
        working-directory: .
      - run: kubectl set image deployment/frontend frontend="${{ needs.build.outputs.image }}"
        working-directory: .
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s
          kubectl get pods
          kubectl get services frontend
        working-directory: .
      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s || true
          echo "----- Logging - kubectl get all -----"
          kubectl get all
          echo "----- Logging - kubectl describe deploy -----"
          kubectl describe deploy frontend
        working-directory: .
      - name: Verify Frontend ECR image
        run: |
          echo "----- Logging - Frontend ECR Image Details -----"
          AWS_PAGER="" aws ecr describe-images \
            --repository-name frontend \
            --region "$AWS_REGION" \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' \
            --output table